# Optional Nginx reverse proxy fragment for the local server.
# Keep these endpoints private/VPN unless you add authentication and IP allowlists.
location /ai/functiongemma/ {
    proxy_pass http://function-gemma-agent:8090/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 300s;
}

location /ai/pocket/ {
    proxy_pass http://pocket-ai-executor:8091/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 300s;
}
